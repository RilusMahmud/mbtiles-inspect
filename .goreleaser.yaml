# GoReleaser config for mbtiles-inspect.
# Docs: https://goreleaser.com  Schema: v2
version: 2

project_name: mbtiles-inspect

before:
  hooks:
    - go mod tidy
    - go run ./testdata/gen.go

builds:
  - id: mbtiles-inspect
    main: ./cmd/mbtiles-inspect
    binary: mbtiles-inspect
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - SPEC.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^test:'
      - '^ci:'
      - merge conflict
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## mbtiles-inspect {{ .Tag }}

    Pure-Go CLI + TUI for inspecting `.mbtiles` files. Single static binary,
    no runtime dependencies.
  footer: |
    ### macOS users

    Binaries are not signed/notarized. After downloading, run:

    ```sh
    xattr -d com.apple.quarantine ./mbtiles-inspect
    ```

    ### Verifying

    ```sh
    sha256sum -c checksums.txt
    ```
